name: deploy
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # The secrets live in the `production` environment, which only main may use.
    environment: production
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: refs
        run: |
          echo "framework=$(cat .framework-ref)" >> "$GITHUB_OUTPUT"
          echo "catalog=$(cat .catalog-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: open-coder-ai/chock-catalog
          path: .catalog
          ref: ${{ steps.refs.outputs.catalog }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt "chock @ git+https://github.com/open-coder-ai/chock@${FRAMEWORK_REF}"
        env:
          FRAMEWORK_REF: ${{ steps.refs.outputs.framework }}
      - run: python -m sitegen --catalog .catalog --out dist
      - run: test -f dist/_headers
      - id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy skipped: Cloudflare secrets not set"
            echo "deploy skipped: Cloudflare secrets not set" >> "$GITHUB_STEP_SUMMARY"
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deploy
        if: steps.cf.outputs.set == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          command: pages deploy dist --project-name=chock-site --branch=main --commit-hash=${{ github.sha }}
      - if: steps.cf.outputs.set == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "Deployed to $DEPLOY_URL"
            if [ -n "$ALIAS_URL" ]; then echo "Branch alias: $ALIAS_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
