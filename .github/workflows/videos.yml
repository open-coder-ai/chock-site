# DOCS-6: renders videos/*.tape to static/video/<name>.{mp4,png} with VHS and writes each
# sidecar (static/video/<name>.json). Manual only: run it from the Actions tab, download the
# `videos` artifact, review it, and commit the files. `contents: read`: it never writes back.
# The unit job's tests/test_videos.py fails when a tape changes without its render committed.
name: videos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: refs
        run: |
          echo "framework=$(cat .framework-ref)" >> "$GITHUB_OUTPUT"
          echo "catalog=$(cat .catalog-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt "chock @ git+https://github.com/open-coder-ai/chock@${FRAMEWORK_REF}"
        env:
          FRAMEWORK_REF: ${{ steps.refs.outputs.framework }}
      # The tapes work in /work/demo, a fixed path so printed paths are stable.
      - run: sudo mkdir -p /work && sudo chown "$(id -u):$(id -g)" /work
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2
        with:
          path: videos/own-policy.tape
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2
        with:
          path: videos/adopt-policy.tape
      - run: |
          python -m sitegen.videos --sidecar own-policy
          python -m sitegen.videos --sidecar adopt-policy --catalog "${CATALOG_REF}"
          python -m sitegen.videos --check
        env:
          CATALOG_REF: ${{ steps.refs.outputs.catalog }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: videos
          path: static/video/
          if-no-files-found: error
