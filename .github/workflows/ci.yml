name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  workflows:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-workflows.txt
      - run: actionlint
      - run: zizmor --offline .github/workflows

  build:
    # The Cloudflare Pages build path: the same script Cloudflare runs.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: sh build.sh
      - run: cat dist/version.json

  unit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: refs
        run: |
          echo "framework=$(cat .framework-ref)" >> "$GITHUB_OUTPUT"
          echo "catalog=$(cat .catalog-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: open-coder-ai/chock-catalog
          path: .catalog
          ref: ${{ steps.refs.outputs.catalog }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps --no-build-isolation "chock @ git+https://github.com/open-coder-ai/chock@${FRAMEWORK_REF}"
        env:
          FRAMEWORK_REF: ${{ steps.refs.outputs.framework }}
      - run: python scripts/install_engine_deps.py
      - run: pip check
      - run: pytest -q --ignore=tests/e2e
      # DOCS-1: re-run the recorded CLI examples against the pinned engine; fail on any difference.
      - run: python -m sitegen.cliexamples --check
      # DOCS-4: the catalog pages' snapshot of .catalog at .catalog-ref, and the adopt run
      # (it fetches the catalog from GitHub) against the pinned engine; fail on any difference.
      - run: python -m sitegen.catalogdoc --catalog .catalog --check
      # DOCS-5: re-run the Write policies pages' recorded runs against the pinned engine; fail on
      # any difference.
      - run: python -m sitegen.writedoc --check

  docs-drift:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # full history: architecture diagrams cite chock-site files at a pinned commit
          fetch-depth: 0
          persist-credentials: false
      - id: refs
        run: echo "framework=$(cat .framework-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: open-coder-ai/chock
          path: .chock-src
          ref: ${{ steps.refs.outputs.framework }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m sitegen.docsource --chock .chock-src --check
      # ARCH-1: every repo/path a diagram cites exists at the commit it pins (public clones).
      - run: python -m sitegen.architecture --check --fetch --clones .arch-src --repo chock-site=.

  e2e:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: refs
        run: |
          echo "framework=$(cat .framework-ref)" >> "$GITHUB_OUTPUT"
          echo "catalog=$(cat .catalog-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: open-coder-ai/chock-catalog
          path: .catalog
          ref: ${{ steps.refs.outputs.catalog }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps --no-build-isolation "chock @ git+https://github.com/open-coder-ai/chock@${FRAMEWORK_REF}"
        env:
          FRAMEWORK_REF: ${{ steps.refs.outputs.framework }}
      - run: python scripts/install_engine_deps.py
      - run: pip check
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: test-results
          path: test-results/

  local-test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
          - os: ubuntu-latest
            shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: shellcheck
        if: matrix.shell == 'bash'
        run: shellcheck scripts/local-test.sh
      - name: PSScriptAnalyzer (errors only)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          }
          $found = Invoke-ScriptAnalyzer -Path scripts/local-test.ps1 |
            Where-Object { $_.Severity -in 'Error', 'ParseError' }
          $found | Format-Table Severity, RuleName, Line, Message -AutoSize -Wrap
          if ($found) { exit 1 }
      - name: local-test.sh
        if: matrix.shell == 'bash'
        run: bash scripts/local-test.sh --no-serve --no-open
      - name: local-test.ps1 (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/local-test.ps1 -NoServe -NoOpen
      - name: local-test.ps1 (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/local-test.ps1 -NoServe -NoOpen
      - name: dist/index.html exists
        shell: bash
        run: test -f dist/index.html
      - name: dist shows no Windows-style paths
        shell: bash
        run: python -m sitegen.distcheck dist

  # DOCS-3: the agentseam pages' sources. The quoted agentseam docs match agentseam at the
  # commit data/agentseam-source/source.json pins, and a re-run of the recorded direct use
  # with that agentseam (installed by chock at .framework-ref) prints the same.
  agentseam-docs:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: refs
        run: |
          echo "framework=$(cat .framework-ref)" >> "$GITHUB_OUTPUT"
          echo "agentseam=$(python3 -c 'import json; print(json.load(open("data/agentseam-source/source.json"))["agentseam_ref"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: open-coder-ai/agentseam
          path: .agentseam-src
          ref: ${{ steps.refs.outputs.agentseam }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt "chock @ git+https://github.com/open-coder-ai/chock@${FRAMEWORK_REF}"
        env:
          FRAMEWORK_REF: ${{ steps.refs.outputs.framework }}
      - run: python -m sitegen.agentseamdoc snapshot --agentseam .agentseam-src --check
      - run: python -m sitegen.agentseamdoc run --check
