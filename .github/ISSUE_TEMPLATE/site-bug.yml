name: Site bug
description: Something on the chock site is wrong — layout, text, a broken link, the builder or the author page
title: "[site]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a policy that misfires, use the [chock-catalog forms](https://github.com/open-coder-ai/chock-catalog/issues/new/choose). For `chock install` or an agent's hooks, use the [chock forms](https://github.com/open-coder-ai/chock/issues/new/choose).
        For a vulnerability, do not open a public issue: use the private security advisory link in the issue chooser.
  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: The page where you saw the problem.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What kind of problem?
      options:
        - layout
        - wrong text
        - broken link
        - builder page
        - author page
        - other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: The agent you picked on the page, if any.
      options:
        - claude-code
        - cursor
        - codex
        - copilot
        - devin
        - other
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Browser and OS
      description: e.g. Firefox 131 on Windows 11.
    validations:
      required: false
  - type: input
    id: catalog-ref
    attributes:
      label: Catalog ref
      description: Shown in the site footer as "Catalog …"; leave blank if unsure.
    validations:
      required: false
  - type: input
    id: engine-ref
    attributes:
      label: Engine ref
      description: The chock engine ref the site was built with; the site's report page fills it in. Leave blank if unsure.
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image here if it helps. Check it shows nothing you would not post publicly.
    validations:
      required: false
