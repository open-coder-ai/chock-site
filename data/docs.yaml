# The docs section at /docs/ (DOC-1, org-plan plan/one-oh-gaps.md).
# This file holds wording and structure only. Every fact on a docs page comes from
# the pinned engine (.framework-ref), the agentseam release the engine pins, or the
# pinned catalog (.catalog-ref): install steps, grades, witnesses, CLI help.
# Prose quoted from chock's own docs lives in data/docs-source/, a snapshot that
# `python -m sitegen.docsource --chock <checkout>` regenerates; CI fails when it drifts.

engine_repo: https://github.com/open-coder-ai/chock
source_dir: docs-source

# Engine client (chock install --client) -> the agentseam agent whose hooks it reaches.
# Every engine client exactly once; every target an agentseam matrix row.
plugin_agents:
  claude-code: claude_code
  copilot: vscode_copilot
  codex: codex_cli
  cursor: cursor
  devin: devin

# Which route each witness-ledger surface proves. A plugin witness never clears a sync claim.
surface_routes:
  plugin-hook: plugin
  agent-hooks: sync
  git-hook-env: git

nav:
  - group: Get started
    pages: [overview, quickstart-plugin, quickstart-repo]
  - group: Guides
    pages: [agents, policies, configure, monitor, troubleshooting]
  - group: Reference
    pages: [cli, release-notes]

pages:
  overview:
    path: /docs/
    title: Docs
    nav_label: Overview
    description: "How chock works and how to use it: plugins for your agent, or hooks in your repo."
    intro: "chock turns guardrail policies into hooks your AI coding agent runs. There are two ways in. The plugin path builds one plugin for one agent from the policies you pick. The repo path wires a repository's own hooks, git hooks and CI, so every clone carries the policies."
    blocks: [paths, labels, grades, witness]
    prose:
      - {file: docs/concepts.md, sections: [Policy, Gate, Enforcement surface]}
      - {file: docs/coverage-levels.md, sections: [The levels]}
  quickstart-plugin:
    path: /docs/quickstart/plugin/
    title: "Quickstart: plugin path"
    nav_label: "Quickstart: plugin"
    description: "Install the engine, pick policies, and build one plugin for your agent."
    intro: "One command builds a plugin from your picks for one agent. The steps after it are the agent's own, exactly as the engine prints them."
    blocks: [install, pick, clients]
    prose: []
  quickstart-repo:
    path: /docs/quickstart/repo/
    title: "Quickstart: repo path"
    nav_label: "Quickstart: repo"
    description: "Onboard a git repository with chock init and chock sync: agent hooks, git hooks and CI."
    intro: "The repo path puts policies in the repository itself, so they travel with every clone. chock sync wires each agent's hook file, the git hooks, and optionally a CI gate."
    blocks: [install, sync]
    prose:
      - file: docs/getting-started.md
        sections: [Prerequisites, 2. Onboard a repository, 3. Install a policy, 4. See enforcement in action, 6. Keep it reproducible]
  agents:
    path: /docs/agents/
    title: Agents
    nav_label: Agents
    description: "Every agent agentseam records: its route, what it can enforce, and what that rests on."
    intro: "One page per agent. Each fact comes from the agentseam matrix the engine pins and from the engine's own data; nothing here is typed by hand."
    blocks: [agent_table]
    prose: []
  policies:
    path: /docs/policies/
    title: Policies
    nav_label: Policies
    description: "Every catalog policy: what it does, its grade on each agent, what it misses, and an example."
    intro: "One page per policy in the pinned catalog. A grade is the catalog's own label for that agent."
    blocks: [policy_table]
    prose: []
  configure:
    path: /docs/configure/
    title: Configure
    nav_label: Configure
    description: "Selection files, switching plugin members on and off, local policies, and where to customise."
    intro: "What you can change after an install, and the files it lives in."
    blocks: [selection, toggles]
    prose:
      - {file: docs/custom-policies.md, sections: [2. Add it to a selection]}
      - {file: docs/baseline-policies.md, sections: [Customising a policy]}
      - {file: docs/adopting.md, sections: ["Golden rule: customize in these places only"]}
  monitor:
    path: /docs/monitor/
    title: Monitor
    nav_label: Monitor
    description: "Where the engine records gate outcomes, and how chock status reads them."
    intro: "Gates in a repo record what they decided in a local log. chock status reads it."
    blocks: [log]
    prose: []
  troubleshooting:
    path: /docs/troubleshooting/
    title: Troubleshooting
    nav_label: Troubleshooting
    description: "Known install notes per agent, what happens when a guard cannot decide, and arming a fresh clone."
    intro: "Each agent's install notes, as the engine prints them, then the engine docs on the cases that most often surprise people."
    blocks: [measured, client_notes]
    prose:
      - {file: docs/troubleshooting.md, first: 20, optional: true}
      - {file: docs/enforcement-surfaces.md, sections: [What happens when the guard cannot decide]}
      - {file: docs/adopting.md, sections: [How to verify a fresh clone enforces]}
  cli:
    path: /docs/cli/
    title: CLI reference
    nav_label: CLI reference
    description: "Every chock command and its options, generated from the engine's own --help."
    intro: "Generated from the engine's argument parsers at the pinned commit."
    blocks: [cli]
    prose:
      - {file: docs/cli-reference.md, sections: [Typical workflows]}
  release-notes:
    path: /docs/release-notes/
    title: Release notes
    nav_label: Release notes
    description: "The newest entries of the engine's changelog at the pinned commit."
    intro: "The newest sections of chock's CHANGELOG.md at the pinned engine commit."
    blocks: []
    prose:
      - {file: CHANGELOG.md, first: 5}

