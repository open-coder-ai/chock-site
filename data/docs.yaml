  # a GitHub file link at the pinned catalog and engine commits.
  catalog-adopt:
    path: /docs/catalog/adopt/
    title: Adopt catalog policies
    nav_label: Adopt catalog policies
    description: "Install policies from chock-catalog into your repository, pinned to a commit and checked against a hash, with the output of a real run."
    intro: "The chock-catalog repository is the public catalog of chock policies. This page adds two of them to a fresh repository with `chock add`, compiles them with `chock sync`, and shows a commit refused by one of them. Every command and output below is from a recorded run."
    blocks: [video, catalog]
    video: adopt-policy
    prose: []
    catalog:
      - heading: Three ways to adopt
        md: |
          The catalog's README names three ways to install the same policies:

          - **In your repository**, for a team: policies are pinned to a catalog commit, committed with the repository, and run at the agent's own hook where the client has one, at commit and in CI. This page walks through it.
          - **In your coding agent, as plugins**, for one person with no repository changes: one plugin repository per agent, each with its own install lines, linked from the README's [Install section](__CATALOG__README.md#install).
          - **One plugin built from your picks**. See [Quickstart: plugin](/docs/quickstart/plugin/).
      - heading: Adopt in your repository, step by step
        run: true
      - heading: Pin a commit and verify the hash
        quote: README.md
        sections: ["Installing this is running code"]
        level: 3
      - heading: Next
        md: |
          - Each policy's page under [Policies](/docs/policies/) lists what it refuses and how it was tested.
          - The CLI reference has every option of [chock add](/docs/cli/add/) and [chock sync](/docs/cli/sync/).
          - To write a policy for the catalog, see [Add a policy to the catalog](/docs/catalog/contribute/).
  catalog-contribute:
    path: /docs/catalog/contribute/
    title: Add a policy to the catalog
    nav_label: Add a policy to the catalog
    description: "Add a new policy to chock-catalog step by step: folder, manifest, implementation, evals, the generators, and the CI jobs a pull request runs."
    intro: "A catalog policy is one folder: a manifest, its evals and, for a guard, its implementation. The catalog's tools generate the rest and its CI checks it. The steps below follow the catalog's CONTRIBUTING.md and tools at the pinned commit, and were dry-run against it."
    blocks: [video, catalog]
    video: catalog-policy
    prose: []
    catalog:
      - quote: CONTRIBUTING.md
        sections: ["The three rules"]
      - heading: Add a policy, step by step
        md: |
          ### 1. Clone the catalog and install its engine

          The catalog's CI installs the engine at the commit named in its `.framework-ref` file. Install the same one, then the test tools:

          ```bash
          git clone https://github.com/open-coder-ai/chock-catalog
          cd chock-catalog
          pip install "chock @ git+https://github.com/open-coder-ai/chock@$(cat .framework-ref)"
          pip install --require-hashes -r requirements/test.txt
          ```

          ### 2. Pick a tree

          A policy lives in one of the trees listed under [Policy trees](#policy-trees). The layout in CONTRIBUTING.md names `base/<id>/`. The catalog runs a subset of `base/` on itself. The catalog publishes the `compliance` and `agentic-security` packs but does not install them in itself.

          ### 3. Scaffold the folder

          `chock new policy` starts from a tested template of one kind: `content_regex`, `guard`, `script`, `rule` or `skill`. Inside the catalog, chock keeps the id as given. It writes the folder to `.agents/policies/<id>/`, the policies the catalog runs on itself, and refreshes that folder's index and `.chock/registry.json`. Move the new folder into its tree and put those three files back:

          ```bash
          chock new policy <id> --kind content_regex --repo .
          mv .agents/policies/<id> base/<id>
          git restore .agents/policies/INDEX.md .agents/policies/INDEX-extended.md .chock/registry.json
          ```

          The `content_regex` template writes `manifest.yaml` and `evals/suite.yaml`. CONTRIBUTING.md also offers the `policy-init` skill that `chock init` installs: ask your agent to run it. Its procedure writes to `<repo_root>/generated/` unless told otherwise, so move its folder into the tree the same way.

          ### 4. Write the manifest

          `manifest.yaml` holds the policy's identity and either a gate or rule text. The engine's [manifest schema](__ENGINE__src/chock/validation/schemas/manifest.schema.json) lists every field. The template's `provenance` names `author: "me"` and `license: "proprietary"`. The catalog's own manifests, such as `base/protect-main-branch/manifest.yaml`, name `license: "Apache-2.0"` and chock-catalog as `source_repo`.

          ### 5. Add the implementation, if it has one

          A guard consulted before a command runs is a script under `implementations/`. The catalog's CODEOWNERS file requests review for every change there. Its tests go in `tests/`, held to 100% line and branch coverage.

          ### 6. Write the evals

          `evals/suite.yaml` holds the cases that decide whether the claim holds. `chock check` replays a case with an `execute` block against the real gate. The engine's [evals guide](__ENGINE__docs/evals.md) describes a suite.

          ### 7. Add the prose entry

          Add `<id>:` with `solves` and `customise` to `docs/policy-prose.yaml`. Without it, `tools/gen_policy_docs.py` stops with `docs/policy-prose.yaml has no entry for '<id>'`.

          ### 8. Add the README row

          `tools/check_readme.py` fails until the README lists the policy as a row in its tier's table, for a gate under **Enforced at commit**.

          ### 9. Regenerate and check

          `python tools/regen_all.py` regenerates every derived file and then runs every check CI runs. It ends `== CLEAN` or names the step that failed. `--fast` skips pytest with coverage and the staged adopter. What it runs is under [What regen_all.py runs](#what-regen-all-py-runs) below.

          ```bash
          python tools/regen_all.py --fast
          ```

          ### 10. Run the tests a pull request runs

          `tools/select_tests.py` prints `FULL`, or the test files CI's targeted jobs run for your change, one per line. Run those files with pytest, or the whole suite for `FULL`:

          ```bash
          python tools/select_tests.py origin/main
          python -m pytest -n auto <the files it printed>
          ```

          ### 11. Commit with a sign-off and open a pull request

          The `dco` job checks every commit for a `Signed-off-by:` line. `git commit -s` adds it.
      - heading: Policy trees
        trees: true
      - quote: CONTRIBUTING.md
        sections: ["Layout", "What CI runs"]
      - heading: What regen_all.py runs
        regen: true
      - heading: CI jobs
        gates: true

  # DOCS-5: the Write policies pages. Their `write` parts are built by the `write` block: a
  # hand-written Markdown part (`md`), a run recorded by `python -m sitegen.writedoc` into
  # data/write-source/ (`run`), a quoted chock doc section (`quote`, which must also be listed
  # under `checked` so the docs snapshot holds it), or a table of every field of one of the
  # installed engine's schemas (`schema`). __ENGINE__ in `md` stands for a GitHub file link at
  # the pinned engine commit.
  write-own:
    path: /docs/write/own-policy/
    title: Write your own policy
    nav_label: Your own policy
    description: "Create a policy in your own repository step by step: scaffold it, read its manifest and evals, validate, eval, sync, and see a commit refused. Every output is from a recorded run."
    intro: "A policy is a folder under `.agents/policies/<id>/` in your repository: a manifest, an eval suite and, for some kinds, a script. This page makes one with `chock new`, checks it, compiles it with `chock sync`, and shows the commit it refuses. Every command and output below is from a recorded run with the engine at the pinned commit."
    blocks: [video, write]
    video: own-policy
    prose: []
    checked:
      - {file: docs/custom-policies.md, sections: [1. Start from a template]}
    write:
      - heading: Before you start
        md: |
          - You have installed chock. See [Quickstart: repo path](/docs/quickstart/repo/).
          - The repository is a git repository. The run below starts in a fresh one.
      - quote: docs/custom-policies.md
        sections: [1. Start from a template]
      - heading: Write a policy, step by step
        run: own
      - heading: Make it refuse your own text
        md: |
          The template refuses one example marker. To make it yours:

          1. In `manifest.yaml`, set `hook.gate.params.content_pattern` to your regular expression and `hook.gate.message` to the line the agent sees. The template's own description says to keep the pattern from matching its own text: `.agents/policies/INDEX.md` quotes the message, and a commit also scans that file.
          2. In `evals/suite.yaml`, change each case's `execute.files` or `execute.writes` so the `block` cases hold text your pattern matches and the `allow` cases do not.
          3. Run the same three commands again:

          ```bash
          chock eval my-<id>
          chock sync --repo .
          chock check --repo .
          ```

          [Manifest reference](/docs/write/manifest/) and [Evals reference](/docs/write/evals/) list every field. The files `chock new` copies are the engine's [manifest template](__ENGINE__src/chock/scaffold/data/kinds/content_regex/manifest.yaml.tmpl) and [eval suite template](__ENGINE__src/chock/scaffold/data/kinds/content_regex/evals/suite.yaml.tmpl).
      - heading: Next
        md: |
          - Make one while you work, from your agent or in the browser: [On the fly](/docs/write/on-the-fly/).
          - Offer it to everyone: [Add a policy to the catalog](/docs/catalog/contribute/).
          - Every option of [chock new](/docs/cli/new/), [chock validate](/docs/cli/validate/), [chock eval](/docs/cli/eval/), [chock sync](/docs/cli/sync/) and [chock check](/docs/cli/check/).
  write-fly:
    path: /docs/write/on-the-fly/
    title: Write a policy on the fly
    nav_label: On the fly
    description: "Make a policy while you work: ask your agent to run the policy-init skill, scaffold one with a single chock new, or fill the templates in the browser. A recorded run writes a guard and feeds it an agent's hook event."
    intro: "A policy can start as one sentence in the middle of a task. There are three ways to turn it into a folder chock enforces. The recorded run below writes a guard against one shell command and shows the hook refusing it."
    blocks: [write]
    prose: []
    checked:
      - {file: src/chock/packs/_skills/policy-init/SKILL.md, sections: [Procedure]}
    write:
      - heading: Three ways
        md: |
          - **Ask your agent.** `chock init` installs the `policy-init` skill at `.agents/skills/policy-init/`. Ask your agent to use it, in your own words: for example, "use the policy-init skill: never let the agent run terraform destroy". This page quotes its procedure below. Its default target is `<repo_root>/generated/`. Name `.agents/policies/<id>/` instead, the folder `chock sync` compiles. Read what it wrote, then run `chock check --repo .` and `chock sync --repo .` yourself.
          - **One command.** `chock new policy <id> --kind <kind>` writes a tested template. Edit it, then eval and sync it. The run below does this for a guard, whose script is the engine's [guard template](__ENGINE__src/chock/scaffold/data/kinds/guard/implementations/%5F%5FID%5F%5F.py.tmpl).
          - **In the browser.** The [policy author](/coding/author/) asks a few questions, fills the same templates, and writes a setup script you download, read and run yourself. It builds a plugin. The site compiles nothing.
      - heading: A guard in one sitting, recorded
        run: fly
      - quote: src/chock/packs/_skills/policy-init/SKILL.md
        sections: [Procedure]
      - heading: Next
        md: |
          - The step-by-step page for a commit-time policy: [Your own policy](/docs/write/own-policy/).
          - Every field: [Manifest reference](/docs/write/manifest/), [Evals reference](/docs/write/evals/).
          - What a hook can and cannot see: [What Chock doesn't stop](/docs/bypasses/).
  write-manifest:
    path: /docs/write/manifest/
    title: Manifest reference
    nav_label: Manifest reference
    description: "Every field of a policy's manifest.yaml, with its type, whether it is required and the values it allows, read from the engine's schema at the pinned commit."
    intro: "`manifest.yaml` is the policy's identity and its payload: a gate, rule text, a skill or a workflow. `chock validate` checks it against the engine's JSON schemas. The site generates the tables below from those schemas, as installed at the pinned commit."
    blocks: [write]
    prose: []
    checked:
      - {file: docs/authoring-policies.md, sections: [Anatomy of a policy folder]}
    write:
      - quote: docs/authoring-policies.md
        sections: [Anatomy of a policy folder]
      - heading: Every field
        schema: manifest.schema.json
  write-evals:
    path: /docs/write/evals/
    title: Evals reference
    nav_label: Evals reference
    description: "How a policy's evals/suite.yaml is laid out, what each case says, and every field of the engine's eval schema at the pinned commit."
    intro: "Every policy ships an eval suite at `evals/suite.yaml`. `chock eval` runs it, and replays a case with an `execute` block against the policy's real gate. The page quotes the engine's own guide first. The table after it comes from the engine's eval schema at the pinned commit."
    blocks: [write]
    prose: []
    checked:
      - {file: docs/evals.md, sections: [Anatomy of a suite, The four categories, Which gate a case is replayed against]}
    write:
      - quote: docs/evals.md
        sections: [Anatomy of a suite, The four categories, Which gate a case is replayed against]
      - heading: Every field
        schema: eval.schema.json
      - heading: Run them
        md: |
          `chock eval` runs every policy's suite, or one policy's when given its id. `chock check --repo .` runs them too, after validation. A recorded run of both is on [Your own policy](/docs/write/own-policy/). Every option is on [chock eval](/docs/cli/eval/).

