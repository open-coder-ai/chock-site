# DOCS-3: the agentseam pages (sitegen/docs.py, sitegen/agentseamdoc.py). They document the
# agentseam commit in data/agentseam-source/source.json. The build fails unless the installed
# agentseam is that commit and chock at .framework-ref requires that same commit.
agentseam:
  repo: https://github.com/open-coder-ai/agentseam
  source_dir: agentseam-source
  run_script: agentseam-run.yaml
  run_record: agentseam-run.json
  # Quoted from agentseam at the pinned commit; `python -m sitegen.agentseamdoc snapshot` copies them.
  quotes:
    - {file: README.md, sections: [How it works]}
    # heading: false quotes a section's body without its own heading line.
    - {file: docs/design.md, level: 1, sections: [Design], heading: false}
    - {file: docs/quickstart.sh, whole: true}
  # The API page's sections. Every name in agentseam.__all__ is listed once; the build fails
  # when one is missing, listed twice, or not exported.
  api_groups:
    - heading: "Contract: Event and Decision"
      names: [Event, Decision]
    - heading: Dispatch
      names: [run, handle, degrade]
    - heading: Matrix
      names: [MATRIX, agents, adapted_agents, capability, can_block, can_rewrite, can_transform, enforcement_level]
    - heading: Events
      names: [EVENTS, SESSION_START, SESSION_END, PROMPT_SUBMIT, PRE_TOOL, POST_TOOL, TOOL_FAILURE, PRE_COMPACT, STOP, SUBAGENT_START, SUBAGENT_STOP, INSTRUCTIONS_LOADED, FILE_CHANGED, UNKNOWN]
    - heading: Outcomes
      names: [ALLOW, DENY, ESCALATE, TRANSFORM, WARN, VOUCH, ASK, REWRITE]
    - heading: Submodules
      names: [adapters, bundler, instructions, packaging, permissions]
    - heading: Version
      names: [__version__]
  texts:
    release_heading: "The release these pages document"
    release_rows:
      package: Package
      commit: Commit
      python: Python
      license: Licence
      requires: Runtime dependencies
      script: Console script
      pinned: Pinned by
    no_requires: "none"
    pinned_by: "Chock's pyproject.toml at the engine commit this site builds from"
    pages_heading: "The agentseam pages"
    pages_items:
      - {page: agentseam-direct, text: "install it, write a handler and wire it, from a recorded run"}
      - {page: agentseam-api, text: "every exported name, its signature and docstring"}
      - {page: agentseam-cli, text: "the agentseam command and each subcommand"}
      - {page: agents, text: "what each agent can enforce, from agentseam's matrix"}
    pages_line: ": __TEXT__."
    prose_heading: "From the agentseam docs"
    install_heading: Install
