  paths_heading: Two paths
  # Each path is a card and a tab. A tab lists, in order: `install` (the engine install
  # command), `pick` (the builder's command forms), or {file, sections}: the first code
  # block of each named section of that engine doc.
  paths:
    - title: "Plugin path"
      body: "The install command builds one plugin for one agent from a selection. No repository changes."
      page: quickstart-plugin
      tab: [install, pick]
    - title: "Repo path"
      body: "chock init and chock sync wire a repository's agent hooks, git hooks and CI."
      page: quickstart-repo
      tab:
        - install
        - {file: docs/getting-started.md, sections: [2. Onboard a repository, 3. Install a policy]}
  labels_heading: What a label means
  labels_intro: "Every policy carries one label per agent. These are the engine's label words:"
  grades_heading: Grades and what they rest on
  grades_intro: "agentseam grades what each agent can enforce before a tool runs, capped by the evidence behind it: a row resting on vendor docs cannot read enforceable. Counts at the pinned agentseam release:"
  grade_row: "__GRADE__: __COUNT__ agents"
  basis_heading: "Basis of each row"
  basis_row: "__BASIS__: __COUNT__ agents"
  witness_heading: Witnessed and documented
  witness_body: "Witnessed means a person saw a chock refusal fire in that agent, on that route, and the engine's ledger records the date and method. Documented means the claim rests on the vendor's docs or source. The engine's ledger at this commit has __COUNT__ rows."
  install_heading: "1. Install the engine"
  pick_heading: "2. Pick your policies"
  pick_body: "Pick policies on the builder. It gives you a share code and the command for your agent. The command takes this form (ask the user before running it):"
  pick_link: Open the builder
  clients_heading: "3. Run it for your agent"
  clients_intro: "Each agent below shows its install steps exactly as the engine prints them. Tested means a person has seen chock's refusals fire in that agent through the plugin."
  agent_page_link: "Agent page"
  sync_heading: Agents chock sync wires
  sync_intro: "chock sync writes these agents' hook files in the repository. Name them with --agents, or leave it out for all of them."
  sync_turn_end: "also gates the end of a turn"
  sync_columns: [Agent, Name for --agents, Hook file, Turn end, State]
  agent_columns: [Agent, Routes, Tier, Grade, Basis, Fail mode]
  route_words: {plugin: plugin, sync: sync, none: none}
  routes_heading: Routes
  plugin_route: "Plugin route: `chock install --client __CLIENT__` (ask the user before running it)"
  sync_route: "Repo hooks: `__COMMAND__` writes `__CONFIG__` (ask the user before running it)"
  enforcement_heading: What it can enforce
  enforcement_fields: {tier: Tier, grade: Grade before a tool runs, fail_mode: Fail mode before a tool runs, basis: Basis, recorded: Recorded}
  events_heading: Events
  events_columns: [Event, Can block, Can rewrite, Fail mode]
  word_yes: "yes"
  word_no: "no"
