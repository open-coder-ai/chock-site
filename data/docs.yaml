  agent_intro: "Install methods: __ROUTES__. Agentseam tier __TIER__, grade __GRADE__ before a tool runs."
  policy_description: "__NAME__: what it does, its label on each agent, what it misses, and examples."
  policy_intro: "Catalog policy __ID__, version __VERSION__, labelled __WORD__ on __AGENT__."
  on_this_page: "On this page"
  copy: "Copy"
  # Callout labels for `> [!NOTE]`, `> [!TIP]` and `> [!WARNING]` in engine docs.
