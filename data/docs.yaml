  # DOCS-2: How Chock works. Each stop fact quotes chock's docs (from the snapshot) or the engine's
  # source as installed from .framework-ref (`src/chock/...`); the build fails when a quote is gone.
  how:
    steps_heading: "The lifecycle, step by step"
    steps_intro: "These steps follow the main path of the lifecycle diagram. Each step links the engine file that does the work, at the pinned commit:"
    steps_diagram: lifecycle
    diagrams_heading: Diagrams
    diagrams_intro: "Each box cites the engine file that does the work, at a pinned commit. Each diagram has a page with a card per box."
    diagrams: [lifecycle, enforcement-surfaces, stop-and-resume, life-of-a-policy]
    surfaces_heading: The hook points
    surfaces_file: docs/enforcement-surfaces.md
    surfaces_section: The nine surfaces
    surfaces_intro: "Chock's own table of the hook points, from its docs at the pinned commit:"
    code_heading: Where each hook point comes from in the engine
    code_intro: "The site reads this table from the engine at the pinned commit. For each hook point it shows the compiler's emitter (`EMITTERS` in `chock.compile.compiler`), the agents the engine gives it, by the engine's agent names (`SURFACE_AGENTS`), and whether it is left out of every coverage word (`UNCREDITED_SURFACES`). The build fails when the hook points in chock's table and in its code differ."
    code_columns: [Hook point, Emitter, Agents, Held out of coverage]
    no_emitter: "None: not emitted"
    no_agents: "none"
    held_out: "yes"
    counted: "no"
    help_heading: "The commands: chock stop and chock resume"
    help_intro: "Here are both commands, as the engine's parsers print them."
    help_commands: [stop, resume]
    limits_intro: "After it writes a stop, chock stop prints its limits in the engine's own words:"
    stop_source: "The engine's stop docs, in full:"
    stop_file: docs/stop.md
    facts:
      - heading: In one repository
        body:
          - "`chock stop` writes `.chock/stop.json`: the scope, the reason, who (git `user.email`) and when. Every tool call, commit and push by an agent in scope is then refused until a person resumes."
          - "`--agent <client>` stops one client. Without it, chock stops every agent. `--reason` is what chock tells the agent: `stopped: <reason>`."
          - "The file is never committed. Chock keeps a copy in `~/.chock/stops/` for hooks that cannot tell which repository their session is in. The hooks read both copies. If they cannot read a stop file, they refuse every agent."
        sources:
          - {file: src/chock/stop.py, quote: "every tool call, commit and push by an agent in scope is refused until resume."}
          - {file: src/chock/stop.py, quote: '{"scope": args.agent or HALT_ALL, "reason": args.reason, "who": git_email(repo) or UNKNOWN}'}
          - {file: src/chock/stop.py, quote: 'doc["when"] = log_now()'}
          - {file: src/chock/stop.py, quote: "Stop this one client only (default: every agent)"}
          - {file: src/chock/stop.py, quote: "Why: the agent is told `stopped: <reason>`"}
          - {file: src/chock/stop.py, quote: "The file is `.chock/stop.json` (never committed), mirrored in `~/.chock/stops/` for hooks that cannot tell which repository their session is in; the hooks read both fail-closed"}
          - {file: src/chock/stop.py, quote: "cannot be read, so every agent is refused."}
      - heading: Only a person changes a stop
        body:
          - "Chock refuses an agent's `chock stop` or `chock resume`, and logs the refusal."
          - "`chock resume` needs a person at their own terminal: stdin and stdout must be a TTY, and the person types the repository's name. If the name does not match, the stop stays in force."
        sources:
          - {file: src/chock/stop_common.py, quote: "Only a person changes a stop (the actor rule): an agent's `chock stop` or `chock resume` is refused, logged."}
          - {file: src/chock/stop.py, quote: "Only a person at their own terminal resumes: stdin and stdout are TTYs and they type the repository's name."}
          - {file: src/chock/stop.py, quote: "the name typed does not match; the stop is still in force."}
      - heading: "Everywhere: one stop for the machine"
        body:
          - "`chock stop --everywhere` writes `~/.chock/stops/_everywhere.json`. While it exists, every chock hook on the machine refuses every tool call, whatever its repository, session or client. `--agent` is refused with it: the scope is every agent."
          - "`chock resume --everywhere` is person-only too: it needs stdin and stdout to be a TTY and asks for the word `everywhere` to be typed. It removes that file only. A per-repository stop stays in force."
          - "`chock status` and `chock doctor` lead with `STOPPED EVERYWHERE` while it is in force."
        sources:
          - {file: docs/stop.md, quote: "`stop --everywhere` writes `~/.chock/stops/_everywhere.json`"}
          - {file: docs/stop.md, quote: "While it exists every Chock hook on the machine refuses every tool call, whatever its repository, session or client"}
          - {file: docs/stop.md, quote: "`--agent` is refused with it: the scope is every agent."}
          - {file: docs/stop.md, quote: "needs stdin and stdout to be a TTY, and asks for the word `everywhere` to be typed. It removes that file only; a per-repository stop stays in force"}
          - {file: docs/stop.md, quote: "`chock status` and `chock doctor` lead with `STOPPED EVERYWHERE` while it is in force."}
      - heading: Where chock checks the stop
        body:
          - "`chock sync` wires one hook of its own per client, `--stop-check`, with no matcher, so the stop sees every tool call, reads included. The plugin carries the same entry."
          - "At the git hooks, chock refuses an agent's commit or push and lets a person's through. Only the main checkout's `.chock/bin/gate.py` tells an agent from a person."
          - "The MCP gateway refuses each `tools/call` while a stop reaches it, with an MCP error, and forwards every other method, so the client can still connect and list tools."
        sources:
          - {file: docs/stop.md, quote: "`chock sync` wires one hook of its own per client, `--stop-check`, with no matcher"}
          - {file: docs/stop.md, quote: "so the stop sees every tool call, reads included. The plugin route carries the same entry"}
          - {file: src/chock/hooks/data/dispatcher.sh, quote: "while .chock/stop.json is in force, an agent's commit or push is refused; a person's passes."}
          - {file: docs/stop.md, quote: "At the git hooks only the main checkout's `.chock/bin/gate.py` tells an agent from a person"}
          - {file: docs/stop.md, quote: "The gateway refuses each `tools/call` while a stop reaches it (an MCP error, `stopped: <reason>`); it forwards `initialize`, `tools/list` and every other method, so the client can still connect and list tools."}
      - heading: Limits
        limits: true
        body:
          - "It reaches only agents whose hooks chock wires and that the client runs. An agent with no hook is stopped at commit and push only."
          - "Devin's hook is best-effort. The vendor runs it so that a hook that errors or times out lets the call through."
          - "A person, or an agent working outside this repository's hooks, is not affected, and such an agent can delete the stop files directly."
          - "The terminal check is best-effort: an agent that can run a shell may give `resume` a pseudo-terminal and type the name."
        sources:
          - {file: src/chock/stop_common.py}
          - {file: docs/stop.md, quote: "It reaches only agents whose hooks Chock wires and that the client runs. An agent with no hook is stopped at commit and push only."}
          - {file: docs/stop.md, quote: "Devin's hook is best-effort: the vendor runs it fail-open, so a hook that errors or times out lets the call through."}
          - {file: docs/stop.md, quote: "A person, or an agent working outside this repository's hooks, is not affected. Such an agent can also delete .chock/stop.json or `~/.chock/stops` directly"}
          - {file: docs/stop.md, quote: "The terminal check is best-effort: an agent that can run a shell may give `resume` a pseudo-terminal"}

  # DOCS-5: wording of the Write policies pages' parts (sitegen/docs.py, the `write` block).
  write:
    run_script: data/write-policy.yaml
    run_setup: "A real run, recorded by `python -m sitegen.writedoc` with the engine at the pinned commit. The steps of `__SCRIPT__` ran in order, offline, in one fresh git repository at `/work/demo`, made with `git init -b main` and a git user name and email set, with HOME at `/home/demo`. Those paths stand for the throwaway folders the run used, and `<time>` stands for a timestamp. Output is stdout and stderr together."
    run_step: "Step __STEP__, exit code __EXIT__."
    # One note per step of each run in data/write-policy.yaml, in order.
    run_notes:
      own:
        - "Set up chock in the repository: the git hook dispatchers and the authoring skills."
        - "Scaffold a policy from the tested `content_regex` template. Outside a catalog the id gains the `my-` prefix. Chock prints the two steps to run next."
        - "The manifest it wrote: the policy's identity and a `content_regex` gate that refuses an added line matching `content_pattern`, at commit and on the agent's file writes."
        - "The two files it wrote: the manifest and the eval suite. The suite holds four cases, each with an `execute` block that chock replays against the gate."
        - "Validate every policy folder against the engine's schemas and rules. It passes. The warning is about the id's first word."
        - "Run the policy's evals. Each case passes."
        - "Compile the policy and wire it: the git hooks, and the hook files of the agents chock wires in this repository. The last lines say how each agent enforces it."
        - "Run every check, ending with one result line."
        - "Stage what chock wrote."
        - "Commit. Chock's pre-commit hook runs, and the commit lands."
        - "Write a file with a line the policy refuses."
        - "Stage it."
        - "Chock refuses the commit with the policy's message, and git exits 1."
        - "Remove the marker."
        - "Stage it again."
        - "The commit lands."
      fly:
        - "Set up chock in the repository. The skills it installs include `policy-init`."
        - "Scaffold a guard from the tested `guard` template: a script that checks a shell command before the agent runs it."
        - "The three files it wrote: the manifest, the eval suite and the guard's script. In the script, `BLOCK` and `ASK` are the patterns of the commands it refuses, or asks about first. Edit both."
        - "Replay its four eval cases against the script."
        - "Compile it and register it with the agents chock wires in this repository. The last lines say how each agent enforces it."
        - "Feed the hook the event Claude Code sends before a Bash tool call running `terraform destroy`. The command is the one `chock sync` wrote for the Bash tool in `.claude/settings.json`, without the git alias around it that first checks the launcher exists. The guard refuses: the hook prints the reason and a `deny` decision."
        - "The same event for `terraform plan` prints nothing, so the call goes ahead."
        - "The decision log counts the refusal."
    schema_dir: src/chock/validation/schemas/
    schema_source: "The schema file at the pinned commit:"
    schema_intro: "Generated from `__FILE__` as installed from the pinned engine commit, with every `$ref` followed into the engine's other schema files. A field `a.b` is `b` inside `a`. A field `a[].b` is `b` in each item of the list `a`. A field `a.<name>.b` is `b` under any key of `a`. Required means required when its parent is present. The first table is the top level. Each object below it has its own table."
    schema_head: [Field, Type, Required, Allowed values, Description in the schema]
    schema_required: ["yes", "no"]
    schema_pattern: "pattern __PATTERN__"
    schema_pattern_file: "A pattern. It holds a backslash, so only the schema file shows it"

