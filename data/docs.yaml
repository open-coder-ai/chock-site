  ask_none: "The engine records no ask claim for this agent."
  timeout_heading: Hook timeout
  timeout_row: "Default __SECONDS__ seconds, set by the __FIELD__ field in __UNIT__."
  timeout_unknown: "The vendor documents no default timeout."
  timeout_none: "The engine records no timeout for this agent."
  timeout_source: Vendor source
  witness_route_heading: Test status
  plugin_state: "Plugin (__CLIENT__): __STATE__."
  sync_state: "Repo hooks: __STATE__. A test of the plugin says nothing about repo hooks."
  note_heading: Note
  note_source: Source
  evidence_line: "Chock has not seen this agent run its hooks yet. If you use it, you can help:"
  ledger_row: "Through the __ROUTE__ install, at hook point __SURFACE__: __CLIENT__, __DATE__. __METHOD__"
  ledger_none: "No row in the engine's list of live tests for this agent."
  evidence_heading: Evidence wanted
  limits_heading: Known limits
  limits_none: "agentseam records no notes for this agent."
  install_steps_heading: Install steps
  policy_columns: [Policy, Label, Status]
  policy_agents_heading: On each agent
  policy_agent_columns: [Agent, Label, What it does there]
  policy_what_heading: What it does
  policy_misses_heading: What it misses
  policy_examples_heading: Examples from its eval suite
  policy_links_heading: More
  policy_catalog_link: The policy on the catalog pages
  policy_source_link: Source at the pinned catalog commit
  selection_heading: The selection file
  toggles_heading: Switch members on and off
  toggles_intro: "These commands come from the engine. Their help appears here as the engine prints it."
  toggle_commands: [bundle, enable, disable]
  log_heading: The decision log
  log_body: "Every chock hook writes one line per decision to a local JSONL file. It uses no network and sends no telemetry, and it never logs a file's contents. Each install method has its own file, and the engine keeps one rotated file beside it:"
  # One line per route the engine names; the files come from the engine.
  log_routes:
    sync: "Repo hooks, in the repository"
    plugin: "Plugin, in your home folder, one folder per agent"
  log_status: "Read it with chock status. Its options, as the engine prints them:"
  log_commands: [status, gate-log]
  summary_heading: "Sum it up: chock status --summary"
  summary_body: "`chock status --summary` reads the same log and reports:"
  summary_command: "chock status --summary [--since DAYS] [--route sync|plugin] [--json]"
  summary_items:
    - "Fires per policy and per client, with block, ask, warn and fault counts and rates. A fault is a hook that could not check the call: reason `guard-errored`, `guard-missing` or `fault`."
    - "The p50 and p95 `duration_ms` per hook (client and hook point). At `info`, chock logs only the calls a policy fired on, so the latencies cover those. Set `debug` to time every call."
    - "A WARN when a hook's p95 is within 25% of its client's hook timeout. When a hook runs past the client's timeout, the call goes through, so a call slower than that goes through unchecked. It shows an undocumented timeout as `unknown` and never warns on it."
    - "The top 5 guard faults, by policy and reason code."
    - "Heartbeats (`session_start` records): hook records with no `session_start` before them, and `session_start` records with no hook record after them, per install method and client. For a client with no session-start event in agentseam's records, the summary says \"no heartbeat available\", never that one is missing."
  export_heading: "Export evidence: chock witness export"
  export_body: "`chock witness export --client <client>` writes one client's records from both install methods, redacted, to a new local JSON file, and prints the agentseam issue to attach it to. It refuses to overwrite an existing file. It uploads nothing: you read the file and attach it yourself."
  export_commands: [witness export]
  person_only_heading: "The settings are a person's"
  person_only_policy: protect-agent-config
  person_only_body: "Files under `.chock/` are a person's to change, the log settings `.chock/chock-log.json` and `~/.chock/chock-log.json` included. Every chock bundle refuses an agent's write to either settings file, through a shell command (best effort) or an Edit/Write. If a repository installs __ID__ (__VERSION__ in the pinned catalog), the policy refuses any agent write to the `.chock/` folder, by shell or by Edit/Write. Its gate makes one exception. It leaves `.chock/state` and `.chock/log` to the engine, which owns them. Reading stays allowed. A client with no chock bundle, in a repository without that policy, has no such refusal. Edit the files yourself, in your own editor or shell."
  person_only_link: "The policy's page"
  measured_heading: Measured problems and fixes
  # Only problems a person measured, with the date.
  measured:
    - heading: "Windows: a Claude Code marketplace update fails with an SSL certificate error"
      body: "Measured on 2026-10-12, on Windows with antivirus that intercepts HTTPS: Claude Code's marketplace update failed with `SSL certificate problem: unable to get local issuer certificate`, while a plain `git fetch` in the same shell succeeded. What fixed it: `git config --global http.sslBackend schannel`, then cloning the stale marketplace copy again. The chock plugin for Claude Code was not affected: it installs from a local folder marketplace, with no git fetch."
  doctor_heading: "Check the hooks: chock doctor"
  doctor_intro: "In most clients, if a hook crashes, times out or never loads, the action goes through anyway. So a silent hook looks exactly like a protected session. `chock doctor` checks that each client's chock hooks are in place, current, and seen running, both in repo hooks and in the plugin. It only reads. It uses no network and never runs a client. Each check prints one line, `PASS`, `WARN`, `FAIL` or `INFO`, with a one-line fix:"
  doctor_items:
    - "Hooks: the file the client reads runs chock's runtime, and the runtime is there."
    - "Launcher: the launcher is there, and a `python3`, `python` or `py` on PATH is 3.11+."
    - "Engine: the runtime matches, byte for byte, what the installed chock builds. For a plugin, doctor also compares the engine version and commit the plugin recorded."
    - "Trust: some clients (Codex, Grok) run a hook only after a person trusts it. Doctor shows how to do that. Chock cannot read the client's record of it."
    - "Client: the client versions agentseam has seen working in a live run. `--client-version` compares yours with them."
    - "Last fired and heartbeat: from the decision log, the last record per hook point, and the `session_start` heartbeats. A client with no documented session-start event reads \"no heartbeat available\", never a failure."
  doctor_exit: "It exits 1 when any check fails or it finds no chock hooks, else 0."
  doctor_commands: [doctor]
  doctor_source: "The engine's doctor docs"
  doctor_source_file: docs/doctor.md
  diagnose_heading: Read what the hooks decided
  diagnose_intro: "The decision log (see Monitor) is where to look when a policy did not fire, or fired when you did not expect it. What the engine docs say about reading it:"
  diagnose_items:
    - "Run `chock doctor` first. In most clients, if a hook crashes or never loads, the action goes through anyway. So a session with no `session_start` heartbeat is the sign of a hook that did not run, and doctor reports it."
    - "`chock status --only log` lists the decisions from both install methods. At the default level, `info`, chock writes only blocks, asks, warns, guard faults and overrides. It does not write allows."
    - "To see every call, allows included, with a redacted trace (wire event, tool, matched rule, the guard's exit code, per-stage timings), a person sets the level to `debug`: `CHOCK_LOG_LEVEL=debug` in the shell the agent client was started from, or `{\"level\": \"debug\"}` in `.chock/chock-log.json`. An agent cannot change the level."
    - "`chock status --summary` lists the top guard faults and warns when a hook's p95 is within 25% of its client's hook timeout, because a call that runs past that timeout goes through."
    - "Logging never changes a verdict, never raises and never blocks. If chock cannot write a line, it drops the line silently."
    - "`chock witness export --client <client>` writes that client's records, redacted, to a new local file and prints the agentseam issue to attach it to. It uploads nothing."
  client_notes_heading: Install notes per agent
  # "What Chock doesn't stop" (COPY-3). Every item names the chock files it rests on. A
  # `quote` must stand word for word in the page's `checked` sections (CHANGELOG.md: the
  # release notes' snapshot), or the build fails. `table` adds rows read from engine,
  # agentseam or catalog data, never typed here.
  bypass:
    sources: "Sources, at the pinned engine commit:"
    # agentseam's fail-mode word for a hook whose crash, timeout or absence lets the call run.
    fail_open: open
    # The engine's label wording for a policy that judges a write only when the turn ends.
    turn_end_marker: "the write itself is not judged"
    no_hook_columns: [Agent, Install methods, Why]
    fail_open_columns: [Agent, Install methods, Tier]
    turn_end_columns: [Agent, Policies that check writes only at turn end]
    # The engine's label keyword for a policy that is rule text only.
    advisory_keyword: advise
    advisory_line: "__COUNT__ of the __TOTAL__ policies in the pinned catalog carry the label __WORD__ on __AGENT__: rule text the agent reads, and may not follow."
    see: "See:"
    misses_intro: "Policies whose catalog entry lists what it misses:"
    items:
      - heading: "Guards add friction, and some tricks get past them"
        body:
          - "Chock's guards are deterministic scripts that match patterns. Chock's own docs call them best-effort friction, not a security boundary: quoting tricks, aliases and new encodings can get past a pattern-based guard. Chock does not stop every attack. It closes common, known entry points before they ship."
        sources:
          - {file: docs/baseline-policies.md, quote: "best-effort friction, not a security boundary."}
          - {file: docs/assurance-case.md, quote: "quoting tricks, aliases, and novel encodings can evade a pattern-based guard"}
          - {file: README.md, quote: "Chock does not stop every attack"}
      - heading: "Agents with no hook, or not wired"
        body:
          - "Chock can stop an action in the agent only where the agent runs a hook that chock wired. If chock has set up no hook for an agent, that agent sees only advisory text. Its commits and pushes still go through chock's git hooks and CI gate, where those are installed. These agents have no install method, or lack one of the two. The reason comes from the engine:"
        table: no_hook
        sources:
          - {file: docs/assurance-case.md, quote: "an agent outside every wired surface sees only advisory text"}
      - heading: "Agents that let the action through when a hook fails"
        body:
          - "On some agents, if a hook crashes, times out or never loads, the tool call runs anyway. So a silent hook looks exactly like a protected session. Agentseam's tier data records what each agent does when a hook fails. On these agents, a hook that fails before a tool runs lets the tool run. `chock doctor` checks that each agent's hooks are in place and running."
        table: fail_open
        see: troubleshooting
        sources:
          - {file: docs/assurance-case.md, quote: "Some agent hosts ignore unexpected hook exits"}
          - {file: README.md, quote: "`in-agent` is the agent's pre-tool hook: best-effort, and it fails open."}
      - heading: "Hook timeouts"
        body:
          - "When a client's hook timeout runs out, the agent stops waiting for the hook and the command runs. Chock writes a timeout above its own 30-second budget into each hook entry it writes, so its own limits fire first and ask or deny. Windsurf's hook entry has no timeout key, so Windsurf's own default applies, and it is not documented. Each agent's page lists its timeout."
        see: agents
        sources:
          - {file: docs/enforcement-surfaces.md, quote: "A client's hook timeout fails **open** (the command runs)"}
          - {file: docs/enforcement-surfaces.md, quote: "so its own default (not documented) applies"}
      - heading: "Writes checked only at turn end"
        body:
          - "Some agents record no file-writing tool that chock's write hook can match. There, a policy that checks file contents does not check the write itself: it reads what the turn left on disk when the turn ends. The file is on disk until then. Counts from each agent's labels in the pinned catalog:"
        table: turn_end
        sources:
          - {file: src/chock/plugin/bundle_grade.py}
          - {file: src/chock/plugin/gate_package.py}
      - heading: "Git hooks: --no-verify and fresh clones"
        body:
          - "`git commit --no-verify` skips every git hook, and so every chock gate. `block-no-verify` refuses the flag before the command runs, but only on agents with wired hooks. Git hooks live in `.git/hooks`, which is not cloned, so a fresh clone enforces nothing until someone runs `chock sync`. The CI gate closes both gaps, but it is not automatic: `chock sync --ci` writes it."
        sources:
          - {file: SECURITY.md, quote: "`git commit --no-verify` skips every git hook, and therefore every Chock gate."}
          - {file: SECURITY.md, quote: "a fresh clone enforces nothing until someone runs `chock sync`."}
          - {file: SECURITY.md, quote: "**It is not automatic.**"}
      - heading: "A person's CHOCK_ALLOW"
        body:
          - "A gate with `action: ask` cannot prompt at commit or push, so it refuses there. A person lets that one command through by running it with `CHOCK_ALLOW=<policy-id>`. This is not honoured for an agent's commit, and in CI an ask is a warning."
          - "Chock tells an agent's commit from a person's by environment variables. `CHOCK_AGENT_COMMIT=0` says \"a person\" and wins over every marker. An agent could set it too, so it is a default and does not prove who made the commit. The guards on the agent's own commands are the separate backstop."
        sources:
          - {file: docs/enforcement-surfaces.md, quote: "it refuses unless a person runs that one command with `CHOCK_ALLOW=<policy-id>[,<policy-id>...]` and it is not an agent commit; in CI it is a warning."}
          - {file: docs/enforcement-surfaces.md, quote: "an agent could set it too, so it is a default and not an identity"}
      - heading: "The observe rollout level"
        body:
          - "`rollout: observe` in `.chock/config.yaml` turns a compiled gate's block or ask into a warning, and `rollout: ask` caps it at ask. The action goes through, and the log records what chock would have blocked. Command guards, `tool_call` gates, the MCP gateway and a script hook's own exit 1 still block. An agent cannot lower the level for itself: it is held to the level committed in HEAD, or a stricter one, and `CHOCK_ROLLOUT` counts only for a person's own commit or push."
        sources:
          - {file: CHANGELOG.md, quote: "observe turns a block or ask into a warning"}
          - {file: CHANGELOG.md, quote: "Not capped: command guards, `tool_call` gates, the MCP gateway and a script hook's own exit 1, which still block."}
          - {file: CHANGELOG.md, quote: "`CHOCK_ROLLOUT` counts only for a person's own commit or push."}
          - {file: src/chock/gate/runner/actor.py}
      - heading: "A guardrail turned off: chock bundle off"
        body:
          - "With the plugin, `chock bundle off <id>` switches one member of the plugin off. The off applies from the next session, not the current one. At repo scope it applies only once `.chock/guardrails.json` is committed. The member stays off until you switch it back on."
        see: configure
        sources:
          - {file: docs/custom-policies.md, quote: "Switch one off like any member: `chock bundle off <id>`."}
      - heading: "A policy disabled: chock disable"
        body:
          - "With repo hooks, `chock disable <id>` adds the policy to `policies.disabled` in `.chock/config.yaml`, recompiles the rest, and removes its git-hook wiring. `chock disable` refuses a policy marked `mandatory: true`."
        sources:
          - {file: docs/cli-reference.md, quote: "`disable` adds a policy to `policies.disabled` in `.chock/config.yaml`, recompiles the enabled policies, and removes its git-hook wiring."}
          - {file: docs/cli-reference.md, quote: "`disable` refuses with exit 2 if the policy is `mandatory: true`."}
      - heading: "Processes already running"
        body:
          - "Chock checks at fixed points: before a tool call, at a turn's end, at commit, at push and in CI. It does not watch an agent afterwards. Once a process is running, such as a background shell or a server the agent started, chock does not check it again."
        sources:
          - {file: docs/agentic-risk-coverage.md, quote: "Chock's value is the deterministic slice *before* commit, push, or execution."}
          - {file: docs/agentic-risk-coverage.md, quote: "Watching an agent after the fact is an EDR product's job"}
      - heading: "Credentials"
        body:
          - "Chock does not manage agent identity, tokens or spend budgets. Identity platforms and gateways own runtime credentials, and chock's `gateway` hook point claims nothing for them today. A policy such as `scan-secrets` refuses a credential written into a change. It does nothing about a credential the agent already holds."
        sources:
          - {file: docs/agentic-risk-coverage.md, quote: "Identity platforms and gateways own runtime credentials and quotas."}
          - {file: docs/agentic-risk-coverage.md, quote: "Chock's `gateway` surface is reserved for repo-scoped budget/egress backstops and claims nothing today."}
      - heading: "What each policy misses"
        body:
          - "Each policy's page has a \"What it misses\" section. Across policies, the same kinds come back: aliases, quoting and shells a guard does not parse, and values that are split, encoded or built at run time. Advisory policies block nothing."
        table: limits
        sources:
          - {file: docs/baseline-policies.md, quote: "Known bypasses (aliases, quoting, non-standard clients) are documented on each policy."}
          - {file: README.md, quote: "`advisory` is rule text the agent reads."}
      - heading: "What Chock sends"
        body:
          - "Chock sends nothing over the network when it enforces. Each check is a deterministic script, with no model call and no network access at enforcement time."
        sources:
          - {file: README.md, quote: "no model call and no network access at enforcement time"}
  cli_groups: {everyday: Everyday, authoring: Authoring, aliases: Pre-launch aliases}
  # DOCS-1: the per-command pages. Every fact on them comes from the engine's parser at
  # .framework-ref or from a run recorded by sitegen/cliexamples.py.
  cli:
    description: "Ask the user before running __NAME__: what it takes and prints, from the engine at the pinned commit."
    index_heading: "Every command and subcommand"
    index_intro: "Each command and subcommand has its own page, generated from the engine's argument parsers at the pinned commit. An alias says which command it stands for."
    index_head: [Command, Group, Summary]
    unknown_command: "`chock` exits 2 for a command it does not have, as its dispatcher says:"
    dispatcher_file: src/chock/cli.py
    syntax_heading: Syntax
    syntax_intro: "This is the usage line argparse builds from this command's parser."
    arguments_heading: "Arguments and options"
    arguments_intro: "The table lists every argument the parser declares, except `-h, --help`, written as argparse prints it. Default is the value the parser uses when you leave the option out. It is empty for a flag or when the parser sets none."
    arguments_md: "Help for each argument is in the table on this page's HTML version and in Help as printed, as the engine words it."
    arguments_head: [Argument, Default, Help]
    choices: "one of: __LIST__"
    required: "(required)"
    no_arguments: "This command takes no arguments besides `-h, --help`."
    subcommands_heading: Subcommands
    subcommands_head: [Subcommand, Summary]
    exit_heading: "Exit codes"
    exit_usage: "2: argparse rejected the arguments, for example an option this command does not have. The site's tests run every command with an unknown option and check that it exits 2."
    exit_own_parser: "This command reads its arguments itself, without argparse."
    exit_recorded: "Chock documents no other exit codes. Each example below shows the code its run returned."
