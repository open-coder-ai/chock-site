# The docs section at /docs/ (DOC-1, org-plan plan/one-oh-gaps.md).
# This file holds wording and structure only. Every fact on a docs page comes from
# the pinned engine (.framework-ref), the agentseam release the engine pins, or the
# pinned catalog (.catalog-ref): install steps, grades, witnesses, CLI help.
# Prose quoted from chock's own docs lives in data/docs-source/, a snapshot that
# `python -m sitegen.docsource --chock <checkout>` regenerates; CI fails when it drifts.

engine_repo: https://github.com/open-coder-ai/chock
source_dir: docs-source

# Which route each witness-ledger surface proves. A plugin witness never clears a sync claim.
surface_routes:
  plugin-hook: plugin
  agent-hooks: sync
  git-hook-env: git

nav:
  - group: Get started
    pages: [overview, quickstart-plugin, quickstart-repo]
  - group: Guides
    pages: [agents, policies, configure, monitor, troubleshooting, bypasses]
  - group: Reference
    pages: [cli, release-notes, where-chock-sits]
  - group: How Chock works
    pages: [how-it-works, surfaces, stop, architecture]
  # DOCS-3: agentseam, the library under chock.
  - group: Agentseam
    pages: [agentseam, agentseam-direct, agentseam-api, agentseam-cli]
  # DOCS-4
  - group: Catalog
    pages: [catalog-adopt, catalog-contribute]
  # DOCS-5
  - group: Write policies
    pages: [write-own, write-fly, write-manifest, write-evals]

pages:
  overview:
    path: /docs/
    title: Docs
    nav_label: Overview
    description: "How chock works and how to use it: plugins for your agent, or hooks in your repo."
    intro: "Chock turns guardrail policies into hooks your AI coding agent runs. There are two ways in. The plugin path builds one plugin for one agent from the policies you pick. The repo path wires a repository's own hooks, git hooks and CI, so every clone carries the policies."
    blocks: [paths, labels, grades, witness]
    prose:
      - {file: docs/concepts.md, sections: [Policy, Gate, Enforcement surface]}
      - {file: docs/coverage-levels.md, sections: [The levels]}
  quickstart-plugin:
    path: /docs/quickstart/plugin/
    title: "Quickstart: plugin path"
    nav_label: "Quickstart: plugin"
    description: "Install the engine, pick policies, and build one plugin for your agent."
    intro: "One command builds a plugin from your picks for one agent. The steps after it are the agent's own, exactly as the engine prints them."
    blocks: [install, pick, clients]
    prose: []
  quickstart-repo:
    path: /docs/quickstart/repo/
    title: "Quickstart: repo path"
    nav_label: "Quickstart: repo"
    description: "Onboard a git repository with chock init and chock sync: agent hooks, git hooks and CI."
    intro: "The repo path puts policies in the repository itself, so they travel with every clone. `chock sync` wires each agent's hook file, the git hooks, and optionally a CI gate."
