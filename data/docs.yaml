  ask_first: "Ask the user before running any command on this page: each one changes how their agent or repository behaves."
  built_engine: "Built from engine"
  built_catalog: "and catalog"
  agent_description: "__NAME__ and chock: routes, install steps, what it can enforce, and the evidence behind it."
  agent_intro: "Routes: __ROUTES__. agentseam tier __TIER__, grade __GRADE__ before a tool runs."
  policy_description: "__NAME__: what it does, its label on each agent, what it misses, and examples."
  policy_intro: "Catalog policy __ID__, version __VERSION__, labelled __WORD__ on __AGENT__."
  on_this_page: "On this page"
  copy: "Copy"
  # Callout labels for `> [!NOTE]`, `> [!TIP]` and `> [!WARNING]` in engine docs.
