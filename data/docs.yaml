  how-it-works:
    path: /docs/how-it-works/
    title: How Chock works
    nav_label: How it works
    description: "The lifecycle of a policy in a repository, from authoring to a verdict and a log line, with diagrams that cite the engine's files."
    intro: "A person authors a policy once. `chock compile` turns it into the control for each hook point, and `chock sync` wires those into the repository. After that, on agents whose hooks chock sets up, the hooks check each tool call, commit and push. Each check returns a verdict and writes one line to a local decision log. The CI gate runs the same check again on each pull request."
