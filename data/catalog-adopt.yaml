# DOCS-4: the scripted adopt run on /docs/catalog/adopt/.
# `python -m sitegen.catalogdoc --catalog <checkout>` runs these steps, in order, with the
# installed engine (it must be .framework-ref) in a fresh git repository, and writes what each
# one printed and its exit code to data/catalog-source/adopt.json. `--check` re-runs them and
# fails when the output or an exit code differs. Never edit the JSON by hand.
# A step is expected to exit 0 unless it declares `exit: N`; a run whose step exits otherwise
# fails instead of recording it, so a stale value below breaks the build, not the page.
#
# __CATALOG_REF__ is replaced by .catalog-ref. `chock add` fetches the catalog from GitHub,
# so this run needs the network. The --verify-sha value is the hash `chock add` printed for
# scan-secrets at .catalog-ref; a pin move that changes the policy changes the hash and fails
# the check.

# Printed in place of the throwaway repository and home folder, so the paths are stable.
repo: /work/demo
home: /home/demo
# Run before the first step and not shown; the page says so (texts.catalog.run_setup).
setup:
  - [git, init, -q, -b, main, .]
  - [git, config, --global, user.name, demo]
  - [git, config, --global, user.email, demo@example.invalid]
steps:
  - {run: [chock, init, .]}
  - {run: [chock, add, protect-main-branch, --ref, __CATALOG_REF__]}
  - {run: [chock, add, scan-secrets, --ref, __CATALOG_REF__, --verify-sha, 288a58ccf6ebae063654c325a1b47e67ec00b336aede78a5fa28d232d386ec0f]}
  - {run: [chock, sync, --repo, ., --ci]}
  - {run: [git, commit, --allow-empty, -m, notes], exit: 1}
  - {run: [git, switch, -c, adopt-chock]}
  - {run: [git, add, -A]}
  - {run: [git, commit, -q, -m, Adopt chock]}
