groups:
- id: common
  title: "Common"
- id: coding
  title: "Coding agents"
questions:
- id: what-is-chock
  group: common
  q: "What is chock?"
  a: "A catalog of guardrail policies for AI coding agents, and the engine that turns a picked set of them into one plugin for your agent. This site is the catalog's front door: every policy is listed with its label, its hash and its source."
- id: security-boundary
  group: common
  q: "Is this a security boundary?"
  a: "No. It is friction: it stops common mistakes and makes risky actions visible. Each label says exactly how far a policy goes."
- id: tracking
  group: common
  q: "Do you collect anything about me?"
  a: "No. Your selection lives in the link after the #, which browsers never send to a server. There is no analytics, no cookie, no account."
- id: free
  group: common
  q: "Is it free?"
  a: "Yes. The engine, the catalog and this site are open source under Apache-2.0."
- id: general-agents
  group: common
  q: "What are general agents?"
  a: "Agents that act for a person or a business. Their guardrails are being designed; there is nothing to install yet."
- id: which-agents
  group: coding
  q: "Which coding agents does this work with?"
  a: "The builder makes one plugin for any of these agents: __AGENTS__. Agents marked tested install with one command; for the others the command builds the plugin and you apply it — see Agents."
- id: labels
  group: coding
  q: "What does \"blocks / asks / warns / advisory\" mean?"
  a: "It is the policy's label — what happens when it fires. blocks: the agent refuses the action. asks: it stops and asks you. warns: the action goes ahead with a warning. advisory: text the agent reads; nothing stops a violation."
- id: update-remove
  group: coding
  q: "How do I update or remove the plugin?"
  a: "Change your picks in the builder and run the new command. The Install page lists, for each agent, how it picks up a rebuild and how to remove the plugin."
- id: what-command-does
  group: coding
  q: "What does the command do on my machine?"
  a: "It fetches the pinned catalog, checks each policy's hash and builds one plugin for your agent. With --apply, given only for an agent marked tested, it also runs that agent's own install commands; without it, it prints them for you."
- id: share
  group: coding
  q: "Can my team share one selection?"
  a: "Yes. The builder makes a share link and a selection file; anyone running the same command gets the same policies, checked against the same pinned commit."
- id: report
  group: coding
  q: "How do I report a wrong block, or anything else?"
  a: "Use the Report an issue page. It opens the right GitHub issue form for a wrong policy, an install problem, a site problem or a new policy idea, already filled in. For a vulnerability, report it privately: the page links each repository's private advisory form."
  link: /report/
  link_label: Report an issue
