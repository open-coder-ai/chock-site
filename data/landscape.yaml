# "Where Chock sits" (COPY-2, org-plan plan/muse-gap-review.md): the docs page at
# /docs/where-chock-sits/. Wording only; sitegen/docs.py renders it.
#
# Rules for every line here:
# - Each layer opens with what that class of product controls and what Chock controls,
#   in our words and naming no vendor, so the section still reads right when an example
#   is removed.
# - Vendor examples are named by id from data/vendor-quotes.json: one sentence from the
#   vendor's own page, its URL and the date it was last found there. The weekly workflow
#   .github/workflows/vendor-quotes.yml re-checks them (sitegen/vendorquotes.py).
# - A claim about chock carries `quotes`: each names a section this page quotes from
#   chock's docs (see `prose` in data/docs.yaml), and the build fails unless the quote
#   is in that section, word for word, at the pinned engine commit. The build also fails
#   unless the chock quotes hash to `chock_quotes_sha256`, so none changes by accident.
# - No superlatives, no pricing, no claim of a tier the engine's data does not give.

chock_quotes_sha256: 60b265faa5dc88871f5ea7c29aea4396b1de54476239ac2007cb1d817e4e6a1d

texts:
  how_heading: How to read this page
  how: "Each layer below opens with what that class of product controls and what Chock controls. Then come the two directions: what the layer can catch that Chock can't, and what Chock can catch that the layer can't. Last come examples of products in the layer, each quoting one sentence from the vendor's own page, with the date we last found that sentence there. The quotes are the vendors' words: we have not tested any of these products. Chock's claims quote chock's own docs at the pinned engine commit, and those sections are shown in full at the end of the page. What Chock can enforce differs per agent:"
  agents_link: each agent's tier and grade
  controls_heading: What this layer controls
  layer_catches: What this layer catches that Chock can't
  chock_catches: What Chock catches that this layer can't
  examples_heading: "Examples, in the vendors' words"
  vendor_link: "Source: __VENDOR__"
  as_of: "as of __DATE__"
  stale: "May be out of date: last checked __DATE__."
  quote: "Chock's docs, __FILE__:"
  closing_heading: Complementary, not a substitute
  closing: "Chock is complementary to these layers, not a substitute for any of them."

layers:
  - heading: Agent identity
    controls: "Agent identity products give each AI agent an account of its own and decide what it may reach: which apps, data, tools and other agents, with which tokens, across a whole organisation."
    chock_controls: "Chock controls what an agent does inside one repository. That repository's policies check the agent's tool calls and commits there, whatever identity the agent runs as."
    examples:
      - entra-agent-id
      - agent-365
      - sailpoint-agentic-fabric
    layer: "Who an agent is, and what it may reach: tokens, apps, data and other agents, across a whole organisation. Taking one agent's access away everywhere at once. Chock's docs list agent identity and tokens among what Chock does not do."
    layer_quotes:
      - file: docs/agentic-risk-coverage.md
        section: "What Chock does not do — stated plainly"
        quote: "Agent identity, tokens, and spend budgets."
      - file: docs/agentic-risk-coverage.md
        section: "What Chock does not do — stated plainly"
        quote: "Identity platforms and gateways own runtime credentials and quotas."
    chock: "A wrong move made with access the agent already has. An agent with valid rights to a repository can still make a commit that breaks one of the repository's policies. At the commit tier, Chock's git hook or CI gate refuses that commit, whichever identity made it."
    chock_quotes:
      - file: README.md
        section: "Guardrails, not guarantees"
        quote: "`commit` is a git hook or CI gate that exits non-zero."

  - heading: OS containment
    controls: "OS containment products run an agent's process inside a boundary the agent cannot change: which files it may read or write, and which network destinations it may reach."
    chock_controls: "Chock controls what the agent does with the access it has inside that boundary: whether a change to the repository is one the repository's policies allow."
    examples:
      - mxc
    layer: "Every file and network access by the agent's process and what it starts, whether or not the action passes through a hook. Chock sees an action in the agent when the agent's hook hands it over, and its docs grade that tier best-effort."
    layer_quotes:
      - file: README.md
        section: "Guardrails, not guarantees"
        quote: "`in-agent` is the agent's pre-tool hook: best-effort, and it fails open."
    chock: "A wrong move inside the boundary. A coding agent is usually given read and write access to its repository. Inside that access, Chock's policies check each commit, and at the commit tier the gate refuses one that breaks a policy."
    chock_quotes:
      - file: README.md
        section: "Guardrails, not guarantees"
        quote: "`commit` is a git hook or CI gate that exits non-zero."

  - heading: Gateways
    controls: "Gateways sit in the path of an agent's traffic: model calls, MCP tool calls and outbound requests routed through them are allowed, denied or sent for review under one central policy."
    chock_controls: "Chock controls the repository end: its hooks and CI gate check a change whether or not the agent's traffic went through a gateway."
    examples:
      - transcend-rails
    layer: "Model calls, outbound network requests and MCP tool calls, for any agent whose traffic is routed through the gateway, under one central policy. Chock's docs leave runtime credentials and quotas to gateways."
    layer_quotes:
      - file: docs/agentic-risk-coverage.md
        section: "What Chock does not do — stated plainly"
        quote: "Identity platforms and gateways own runtime credentials and quotas."
    chock: "Actions that never pass a gateway. Chock's controls are compiled into the agent's own hooks, git hooks and a CI gate in the repository, so a commit is checked at the git hook or in CI whether or not the agent's traffic went through a gateway."
    chock_quotes:
      - file: docs/concepts.md
        section: "Enforcement surface"
        quote: "Chock models nine: `ambient-rule`, `git-hook`, `ci-gate`, `pre-tool-use`, `stop`, `agent-hooks`, `managed-setting`, `gateway`, `mcp-gateway`."
      - file: README.md
        section: "Guardrails, not guarantees"
        quote: "`commit` is a git hook or CI gate that exits non-zero."

  - heading: Inventory and monitoring
    controls: "Inventory and monitoring products list the agents an organisation runs across many platforms, with each agent's owner, cost, performance and approval status."
    chock_controls: "Chock controls single actions as they happen, in each repository it is installed in."
    examples:
      - dataiku-agent-management
      - sap-leanix-agent-hub
    layer: "Which agents exist across many platforms, who owns them, what they cost, how they perform, and which are approved. Chock works inside each repository it is installed in: a policy is a folder in that repository."
    layer_quotes:
      - file: docs/concepts.md
        section: Policy
        quote: "A **policy** is a self-contained folder under `.agents/policies/<id>/`"
    chock: "The action itself, at the moment it happens. An inventory records which agents exist, who owns them and which are approved. Chock's gate decides on the commit, and on supported agents on the tool call, before it lands or runs."
    chock_quotes:
      - file: README.md
        section: "Guardrails, not guarantees"
        quote: "`commit` is a git hook or CI gate that exits non-zero. `in-agent` is the agent's pre-tool hook: best-effort, and it fails open."

  - heading: Browser and edge
    controls: "Browser and edge products govern what people and agents do in the browser, on the device and on the network, including on devices an organisation does not manage."
    chock_controls: "Chock controls changes to a repository, checked against that repository's own policies."
    examples:
      - island
    layer: "What people and agents do in the browser, on the device and on the network: data leaving through a web app, a risky extension, device posture, and policy on devices an organisation does not manage. None of Chock's hook points is a browser or an endpoint agent, and its docs leave endpoint watching to EDR products."
    layer_quotes:
      - file: docs/concepts.md
        section: "Enforcement surface"
        quote: "Chock models nine: `ambient-rule`, `git-hook`, `ci-gate`, `pre-tool-use`, `stop`, `agent-hooks`, `managed-setting`, `gateway`, `mcp-gateway`."
      - file: docs/agentic-risk-coverage.md
        section: "What Chock does not do — stated plainly"
        quote: "Watching an agent after the fact is an EDR product's job"
    chock: "A change checked in the repository itself. Where a repository runs Chock's CI gate, it checks the pushed commits there, whichever browser, device or network they came from."
    chock_quotes:
      - file: README.md
        section: "Guardrails, not guarantees"
        quote: "`commit` is a git hook or CI gate that exits non-zero."
