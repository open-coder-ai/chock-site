- source: agentseam src/agentseam/data/matrix.json
  sentences:
  - A deny at pre_tool refuses the call and its reason becomes the tool error; at post_agent (the stop-like event) it asks the agent to retry, capped by Vibe at 3 retries per hook per user turn.
  - 'A deny is hookSpecificOutput.permissionDecision: deny at PreToolUse and decision: block at UserPromptSubmit and Stop.'
  - A transform at pre_tool is written as hook_specific_output.tool_input, which Vibe documents as a full replacement of the tool's arguments, re-validated against the tool's schema (a replacement that fails validation is denied); at post_agent a transform degrades to a block.
  - 'Adapted (D2a): Vibe''s payload is unambiguous (its snake_case hook types pre_tool, post_tool and post_agent are mapped by no other adapter, so the event name alone separates it), and its verdict is the flat_decision family''s {decision: deny, reason}.'
  - 'Adapted (D2b): Cline runs one executable per event from .clinerules/hooks/, named exactly after the event, and reads {"cancel": true, "errorMessage"} on stdout as a block.'
  - 'D2a (2026-10-11) re-checked this and kept the row unadapted: D1''s detection covers only part of Kiro''s documented events (the alias and mcp_<server>_<tool> tool calls), not the V3 primary-tool or tool-less payloads, and an adapter cannot claim those without making Claude Code payloads ambiguous; the exit-code-only verdict and the versioned hook file would also need a new family.'
  - 'Every plugin hook is spawned as `sh -c <command>` on every platform, Windows included: hook_command() calls Command::new("sh") with no Windows branch (its only cfg branch swaps in flatpak-spawn on Linux), and the hooks module never reads GOOSE_SHELL, which selects only the developer shell tool''s shell (vendor-source: aaif-goose/goose v1.55.0 = 2bcb858, crates/goose/src/hooks/mod.rs:1093-1098; read 2026-10-18).'
  - 'Fail mode is configurable and only at PreToolUse: a failed hook is fail-open by default, and on_failure: block makes it fail closed -- agentseam''s install writes on_failure: block on every hook entry it writes (goose reads it at PreToolUse only).'
  - Fail mode is documented only for non-2 exits (fail-open); timeout and malformed-output behaviour are not documented.
  - 'Fail-open on both hosts: a hook that times out, crashes or prints something other than JSON is logged and the tool runs.'
  - 'Fail-open: the docs say any exit code other than 0 and 2 is an error and the operation proceeds.'
  - Install writes .factory/hooks.json keyed directly by event name, the documented project file; Droid snapshots hooks at startup, so a new hook applies to the next session.
  - Its final docs document no hook surface; a user report against 3.47.0 (RooCodeInc/Roo-Code#10834) describes undocumented PreToolUse/PostToolUse hooks in the code, so this row records not-found rather than absent.
  - 'Known limit: file_editor''s own sub-command (view, create, str_replace, insert, undo_edit) arrives in tool_input.command, the same key as terminal''s shell command, so Event.command carries it for file_editor calls; a shell policy should check event.tool.'
  - No adapter is built for an archived agent on an undocumented surface.
  - 'On Windows it runs a hook `command` through cmd.exe, so quoting inside the command does not reach git.exe: with an argument single-quoted, git split it (`unknown option: -f`) and cmd.exe ran the rest, `''{'' is not recognized as an internal or external command, operable program or batch file.`; with the quotes changed to `\"`, git still failed with `unknown option: -f` (exit 129).'
  - One naming a V3 primary tool (read, write, shell), or carrying no tool (SessionStart, UserPromptSubmit, Stop), has nothing that separates it and is still recognised as Claude Code, whose deny is a JSON body with exit 0; Kiro reads only the exit code, so that deny would not block.
  - 'One run: no claim above changes and nothing is marked witnessed.'
  - 'Owner witness run, 2026-10-18, chock''s own goose plugin (not a Claude Code plugin), goose 1.55.0 on Windows 11: with no sh on PATH, the guard, the gate and a benign `git status` were all denied with that hook-failure message, and setting GOOSE_SHELL=powershell changed nothing; with Git for Windows'' Git\bin (sh.exe) put on PATH, the benign call ran, the guard (`git commit --no-verify`) was refused before it ran and the gate (a write of an unpinned GitHub Action) was refused at write (org-plan witness/results/witness-goose-2026-10-18.md at 6316fd3).'
  - PreToolUse and Stop are the only events that can block; a block from any other event is ignored.
  - PreToolUse, UserPromptSubmit and Stop can block; a block at Stop keeps the conversation going.
  - PreToolUseResult, BeforeReadFile, BeforeShellExecution and AfterShellExecution are observation-only and parse as unknown; AfterFileEdit is wired as file_changed.
  - 'Security caveat: CVE-2026-82533 (CNA VulnCheck, published 2026-09-08, CVSS 4.0 9.4): before 0.1.2-alpha.1, the loopback control API at 127.0.0.1:3080 trusted a client-supplied loopback Host header instead of the real connection origin, so a sandboxed tool process could call it to switch itself to danger-full-access with approvals off; fixed in 0.1.2-alpha.1.'
  - Shell policies see Execute; write policies see Create, Edit, MultiEdit and ApplyPatch, whose patch text is read as content but whose target path lives inside the patch and is not extracted.
  - Stop stays fail-open whatever on_failure says, and goose caps consecutive Stop blocks (GOOSE_STOP_HOOK_BLOCK_CAP).
  - 'The config is a versioned list of named hooks with a trigger and an action object, which no install wrapper writes; the verdict is an exit code only, and the IDE and CLI read it differently (IDE: any non-zero exit blocks Pre Tool Use; CLI: only exit 2 blocks, other codes fail open); and the payload is Claude-shaped (hook_event_name, cwd, session_id, tool_name, tool_input) with no key that separates it from a Claude Code payload.'
  - The docs document only the project file; a user-level ~/.openhands/hooks.json exists in the SDK source, and a project file shadows it rather than merging.
  - 'The one external-process decision point is the legacy permission rule action delegate: an exit-code helper (0 allow, 1 ask, 2 reject) that receives only the tool''s parameters and $AGENT_TOOL_NAME, no event name, runs only when the user''s settings already opt into the old permissions system, and has no documented timeout or failure behaviour; it is not a lifecycle hook surface and is not claimed as one.'
  - The standalone OpenHands-CLI repository says it is no longer actively maintained; the hooks docs still list the CLI.
  - 'The two hosts name the same file differently in the payload: the VS Code extension sends hookName PreToolUse, the CLI/SDK sends its own event name tool_call; both are mapped, and every payload carries clineVersion, which no other vendor sends.'
  - 'Unadapted, not none: Amp''s hook surface is an in-process TypeScript plugin API (tool.call can reject or modify a call), which no agentseam family speaks and which the plan keeps on watch.'
  - 'Unadapted, not none: DeepSeek Harness has no hook surface of its own.'
  - 'Unadapted, not none: Kilo Code has a real interception surface, but it is the OpenCode-derived in-process JS/TS plugin API (tool.execute.before), not a command hook that hands a JSON payload to an external process.'
  - 'Unadapted, not none: Kiro has a real command-hook surface, but its dialect is one no agentseam family speaks.'
  - 'Unadapted, not none: OpenCode has a real interception surface, but it is an in-process JS/TS plugin API (tool.execute.before), not a command hook that hands a JSON payload to an external process.'
  - Value-based detection (D1) now declines a Kiro payload naming an MCP tool as mcp_<server>_<tool> (Claude Code spells it mcp__<server>__<tool>) or a tool alias Claude Code never sends (fs_read, fsRead, fs_write, fsWrite, execute_bash, execute_cmd, use_aws; kiro.dev/docs/reference/built-in-tools, updated 2026-10-10), so it detects as no agent.
  - Vibe also speaks ACP (vibe-acp), a client-agent protocol, not a hook surface; it is not claimed as one.
  - dsh also speaks ACP (dsh-acp), a client-agent protocol, not a hook surface.
  - 'post_agent stays fail-open: Vibe rejects strict there.'
  - run_commands' command list arrives as JSON text in preToolUse.parameters and is read as one command per line; apply_patch's target path lives inside the patch text and is not extracted.
