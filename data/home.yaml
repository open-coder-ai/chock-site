  demo_title: "A refused move, from the policy's own test"
  demo_tabs_label: "Policies"
  demo_note: "Each tab is a test case from that policy's own suite, run at catalog __CATALOG_REF_12__."
  demo_refused: "Refused by"
  demo_staged: "staged file"
  demo_policy_link: "Read the policy"
  works_label: "WORKS WITH"
  sections_eyebrow: "THREE PLACES TO USE CHOCK"
  sections_heading: "One idea: name the wrong action, then stop it."
  sections_intro: "Agents that write code get guardrails today, and so can your own git repository. We are still designing guardrails for general agents."
  track_cards:
    coding:
      stats: ["policies", "presets", "agents"]
      buttons:
        - {label: "Build your plugin", href: "/coding/builder/", primary: true}
