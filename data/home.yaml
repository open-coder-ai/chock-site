  secondary_cta: "See how it works"
  copy_label: "Copy"
  install_aria: "Copy install command"
  ticks: ["Free and open source", "No sign-up", "Nothing tracked", "Runs on your machine"]
  demo_label: "Example of a policy refusing a command"
  demo_title: "A refused move, from the policy's own test"
  demo_tabs_label: "Policies"
