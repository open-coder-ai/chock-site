# Shared with the Coding agents home page (`steps`) and its own copy (`coding`).
# The home page's copy is under `landing`.
# Each video: files under static/video/, served at /video/. The build checks each path.
videos:
  - title: "The chock story"
    src: /video/chock-promo-v9b.mp4
    poster: /video/chock-promo-v9b-poster.jpg
    width: 1280
    height: 720
    duration: "1:02"
    description: "A one-minute story: an AI coding agent is refused twice by chock and fixes its own work."
  - title: "The full story"
    src: /video/chock-promo-v8-explainer.mp4
    poster: /video/chock-promo-v8-explainer-poster.jpg
    width: 1280
    height: 720
    duration: "1:57"
    description: "A two-minute look at how chock stops an agent's risky moves, and the incidents behind each policy."
primary_cta: "Build your plugin"
secondary_cta: "Browse the policies"
steps_heading: "How it works"
steps:
  - {title: "Pick policies", body: "Tick the ones you want, or start from a preset such as Git hygiene or Secrets."}
  - {title: "Run one command", body: "Ask before running `chock install --selection '…'`: it builds one plugin on your machine and checks every policy against its hash."}
  - {title: "Keep working", body: "Your agent now checks each risky action. Change your picks any time and run the command again."}
landing:
