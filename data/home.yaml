  stats_line: "__COUNT__ POLICIES · __TESTED__ TESTS"
  headline_lead: "Teach your AI agent"
  headline_accent: "what not to do."
  sub: "chock stops an agent before it takes a risky step. It works with coding agents today. Guardrails for agents that act for people and businesses are in design."
