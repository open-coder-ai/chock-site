# Shared with the Coding agents home page (`steps`) and its own copy (`coding`).
# The home page's copy is under `landing`.
primary_cta: "Build your plugin"
secondary_cta: "Browse the policies"
steps_heading: "How it works"
steps:
  - {title: "Pick policies", body: "Tick the ones you want, or start from a preset such as Git hygiene or Secrets."}
  - {title: "Run one command", body: "Ask before running `chock install --selection '<code>'`: it builds one plugin on your machine and checks every policy against its hash."}
  - {title: "Keep working", body: "Your agent now checks each risky action. Change your picks any time and run the command again."}
landing:
  eyebrow: "OPEN SOURCE · POLICY BLOCKS FOR CODING AGENTS"
  stats_line: "__COUNT__ POLICIES · __TESTED__ TESTS"
  headline_lead: "Blocks your coding agent's"
  headline_accent: "wrong moves before they land."
  sub: "You decide what your agent must never do. Chock blocks that one action and leaves everything else alone. It doesn't suggest changes or rewrite code, so the agent keeps working."
  primary_cta: "Build your plugin"
  secondary_cta: "See how it works"
  copy_label: "Copy"
  install_aria: "Copy install command"
  ticks: ["Free and open source", "No sign-up", "Nothing tracked", "Runs on your machine"]
