tracks:
  - id: coding
    slug: coding
    title: Coding agents
    status: available
    summary: "Rules for agents that write code: refuse git commit --no-verify, keep secrets out of files, stop the agent editing its own guardrails. Pick them and your agent, and install one plugin."
  - id: general
    slug: general
    title: General agents
    status: in_design
    summary: "Guardrails for agents that act for a person or a business. We are still designing them."
  - id: repos
    slug: repos
    title: Git repositories
    status: available
    summary: "Install policies into your own repository: committed with the code, enforced at commit and in CI for contributors who run `chock sync`, and for agents whose hooks are set up."
